<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <rect width="1600" height="1000" fill="#1f1d19"/>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="30" fill="#a39b8b">
    <text x="120" y="190">$ grep -o 'Content-Security-Policy.*' dist/index.html</text>
    <text x="120" y="270" fill="#6cc28f">Content-Security-Policy:</text>
    <text x="160" y="320" fill="#ece5d6">default-src 'self';</text>
    <text x="160" y="370" fill="#ece5d6">script-src 'self';</text>
    <text x="160" y="420" fill="#ece5d6">style-src 'self';</text>
    <text x="160" y="470" fill="#ece5d6">frame-src https://www.youtube-nocookie.com;</text>
    <text x="160" y="520" fill="#ece5d6">object-src 'none'; base-uri 'self'</text>
    <text x="120" y="620">$ git log --all -- Flies/Isaac_Tan_CV.pdf</text>
    <text x="120" y="670" fill="#6cc28f">(nothing: old versions removed from history)</text>
    <text x="120" y="770">$ grep -c '&lt;script src="http' dist/index.html</text>
    <text x="120" y="820" fill="#6cc28f">0</text>
  </g>
  <g transform="translate(1220 520) rotate(-8)">
